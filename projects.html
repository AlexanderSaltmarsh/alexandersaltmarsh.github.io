<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="studies.html">Current Studies</a></li>
        <li><a href="hobbies.html">Hobbies</a></li>
    </ul>
</nav>

<div class="projects-container">
  
  <aside class="projects-legend">
    <h3>Project Index</h3>
    <ul>
      <li><a href="#rocketry">Rocketry & Propulsion</a></li>
      </ul>
  </aside>

  <div class="projects-content">
    
    <section id="rocketry" class="project-module">
      <h2>Rocketry & Propulsion</h2>
      <p>TEST STAND INFORMATION [UPDATE]</p>

      <div class="media-gallery">
        <img src="media/Rocketry Image 1.jpg" alt="Rocketry Image 1" class="lightbox-trigger">
        <img src="media/Rocketry Image 2.jpg" alt="Rocketry Image 2" class="lightbox-trigger">
        <img src="media/Rocketry Image 3.jpg" alt="Rocketry Image 3" class="lightbox-trigger">
        <img src="media/Rocketry Image 4.jpg" alt="Rocketry Image 4" class="lightbox-trigger">
        <img src="media/Rocketry Image 5.jpg" alt="Rocketry Image 5" class="lightbox-trigger">
        
        <video class="lightbox-trigger" preload="metadata" muted>
        <source src="media/bang_metal.mov" type="video/quicktime">
        Your browser does not support the video tag.
        </video>
      </div>
    </section>
  </div>
</div>

<div id="mediaModal" class="modal">
  <span class="close-modal">&times;</span>
  <div id="modalContentWrapper">
    </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('mediaModal');
    const modalWrapper = document.getElementById('modalContentWrapper');
    const closeBtn = document.querySelector('.close-modal');
    const triggers = document.querySelectorAll('.lightbox-trigger');

    triggers.forEach(trigger => {
      trigger.addEventListener('click', function() {
        modalWrapper.innerHTML = ''; 
        const elementClone = this.cloneNode(true);
        
        if (elementClone.tagName.toLowerCase() === 'video') {
          elementClone.setAttribute('controls', 'true');
          elementClone.play();
        }
        
        elementClone.classList.remove('lightbox-trigger');
        modalWrapper.appendChild(elementClone);
        modal.classList.add('show');
      });
    });

    const closeModal = () => {
      modal.classList.remove('show');
      setTimeout(() => { modalWrapper.innerHTML = ''; }, 300); 
    };

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  });
</script>

</body>
</html>
